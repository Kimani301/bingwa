
name: Build Bn APK and publish install page

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare installation page
        run: |
          mkdir site
          cp -r docs/. site/
          cp app/build/outputs/apk/debug/app-debug.apk site/Bn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bn-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
