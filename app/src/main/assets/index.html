<script src="firebase-config.js"></script>
<script>
/* ===== NATIVE BRIDGE (what the Android wrapper must provide) =====
   1. NativeBridge.dialUssd(code, simSlot)  -> wrapper dials the code on that SIM (0 = SIM 1, 1 = SIM 2, -1 = phone default)
   2. Wrapper calls window.onSmsReceived(sender, "<sms text>", simSlot) for every incoming SMS (simSlot 0 or 1)
   2b. NativeBridge.replyUssd("2") sends a reply inside the USSD session that is open (used by Advanced offers);
       NativeBridge.endUssd() (optional) closes that session
   3. Wrapper calls window.onUssdResponse("<reply text>") with the on-screen reply of a USSD session
      (this is how the airtime balance reply from *144# is read).
   In a normal browser none of these exist, so the app runs in Test mode (dialing is simulated). */

const $=s=>document.querySelector(s);
const L=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

const DEF=[[19,'1GB - 1 hour',1],[20,'Bingwa 250MB - 24hrs',2],[48,'Bingwa 750MB - 24hrs',3],[49,'Bingwa 1.5GB - 3hrs',7],[51,'400MB - 7 days',4],[55,'Bingwa 1GB - till midnight',6],[99,'1.5GB - 24hrs',5]]
  .map(([a,n,k])=>({id:uid()+k,amount:a,name:n,ussd:'*180*5*2*n*'+k+'*1#',on:true}));
let offers=L('bs_offers',DEF), sales=L('bs_sales',[]), set=Object.assign({auto:true,wait:3,gap:3,rate:10,balCode:'*144#',dialSim:'auto',readSim:'both',autoBal:true,theme:'light',speed:'balanced',smsOn:true,smsFailOn:true,smsSim:'auto',smsOk:'Your offer of Ksh{amount} has been successfully renewed.',smsNoOn:true,smsNo:'Hi, we received your payment of Ksh{amount} but we have no bundle at that price right now. Please contact us to get your bundle or a refund.',smsDup:'Hi, the number {phone} has already been recommended today. Kindly send a new number.'},L('bs_set',{})), bal=L('bs_bal',null), logs=L('bs_log',[]).filter(e=>e&&e.t>Date.now()-864e5), tab='home', per='today', sf='all', ot='normal';
const save=()=>{try{syncDaily()}catch(e){}W('bs_offers',offers);W('bs_sales',sales.slice(0,500));W('bs_set',set);window.Team&&Team.dirty();window.Web&&Web.publishSoon()};
/* weekly sales chart: kept apart from the sales list, so Clear sales history never wipes it. It starts fresh every Monday. */
const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return +d};
let daily=L('bs_daily',{});
function syncDaily(){
  const ws=weekStart();let ch=false;
  if(!daily||typeof daily!=='object'||Array.isArray(daily)){daily={};ch=true}
  Object.keys(daily).forEach(k=>{if(!daily[k]||daily[k][0]<ws){delete daily[k];ch=true}});
  sales.forEach(x=>{if(x.status==='success'&&x.t>=ws&&!daily[x.id]){daily[x.id]=[x.t,x.amount];ch=true}});
  if(ch)W('bs_daily',daily)
}
const hasBridge=()=>!!(window.NativeBridge&&window.NativeBridge.dialUssd);

function applyTheme(){
  const d=set.theme==='dark'||(set.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme=d?'dark':'light';
  const tb=$('#tbtn');if(tb)tb.textContent=d?'\u2600\uFE0F':'\uD83C\uDF19';
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=d?'#0a2915':'#0b3d1d';try{NativeBridge.setBars(d?'#0a2915':'#0b3d1d',d?'#151f19':'#fdfffd',d)}catch(e){}
}
function toggleTheme(){set.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme();const t=$('#th');if(t)t.value=set.theme}
applyTheme();
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme)}catch(e){}
/* activity log: kept for 24 hours, then clears itself; can also be cleared by hand */
const logPrune=()=>{const c=Date.now()-864e5;logs=logs.filter(e=>e&&e.t>c).slice(0,150)};
const logHtml=()=>logs.length?logs.map(e=>'<div>'+esc(e.x)+'</div>').join(''):'<div>Nothing logged in the last 24 hours.</div>';
const logShow=()=>{const e=$('#loglist');if(e)e.innerHTML=logHtml()};
function addLog(m){logs.unshift({t:Date.now(),x:tm(Date.now())+'  '+m});logPrune();W('bs_log',logs);logShow()}
function clearLog(){logs=[];W('bs_log',logs);logShow();toast('Activity log cleared')}
setInterval(()=>{const n=logs.length;logPrune();if(logs.length!==n){W('bs_log',logs);logShow()}},600000);
function celebrate(s){
  toast('\uD83C\uDF89 Sold KSh '+s.amount+(s.phone?' to '+s.phone:''));
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#00c853','#ffc700','#1e88ff','#ff4757','#8e5cf7','#ff8a1f'];
  for(let i=0;i<28;i++){const d=document.createElement('div');d.className='cf';
    d.style.left=(4+Math.random()*92)+'vw';d.style.background=cols[i%cols.length];
    d.style.setProperty('--dx',(Math.random()*120-60)+'px');d.style.setProperty('--rot',(360+Math.random()*540)+'deg');
    d.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- phone + SMS parsing ---------- */
function normPhone(p){if(!p)return null;let d=String(p).replace(/\D/g,'');if(d.startsWith('254')&&d.length===12)d='0'+d.slice(3);else if(d.length===9&&/^[17]/.test(d))d='0'+d;return /^0[17]\d{8}$/.test(d)?d:null}
const PH='((?:\\+?254|0)[17]\\d{8})';

let seen=L('bs_seen',[]);
const mpesaSender=x=>String(x||'').toLowerCase().replace(/[^a-z]/g,'').includes('mpesa');
function findPhone(t){const m=String(t).match(/(?:\+?254|\b0)[\s-]?[17](?:[\s-]?\d){8}/);return m?m[0]:null}
/* catch-up: read M-Pesa texts straight from the phone inbox so none is missed, even if the live listener was asleep */
let lastScan=0;
function catchUp(){
  if(!hasBridge()||!NativeBridge.inboxSince||Date.now()-lastScan<20000)return;
  lastScan=Date.now();
  let a;try{a=JSON.parse(NativeBridge.inboxSince(Date.now()-6*3600e3))}catch(e){return}
  const first=!L('bs_cu',0);if(first)W('bs_cu',Date.now());
  let n=0;
  a.sort((x,y)=>x.t-y.t).forEach(m=>{
    const b=String(m.b||'');
    if(!(/\bconfirmed\b/i.test(b)&&/\breceived\b/i.test(b)))return;
    const code=(b.match(/\b(?=[A-Z0-9]*[A-Z])[A-Z0-9]{10}\b/)||[])[0];
    if(!code||seen.includes(code)||sales.some(x=>x.code===code))return;
    if(first&&Date.now()-m.t>10*60e3){seen.push(code);W('bs_seen',seen.slice(-400));return}   /* first run: old texts are only marked as seen, never dialled */
    n++;onSmsReceived(m.a,b,null);
  });
  if(n)addLog('Caught up '+n+' missed M-Pesa text'+(n>1?'s':''));
}
setTimeout(catchUp,2500);setInterval(catchUp,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)catchUp()});

window.onSmsReceived=function(sender,body,slot){
  body=String(body||'');let m;
  if(scan&&/^ussd$/i.test(String(sender)))return impReply(body);
  if(cal&&/^ussd$/i.test(String(sender)))return calReply(body);
  if(balWait&&/^ussd$/i.test(String(sender))){
    const x=body.match(/(?:ksh|kes)\.?\s?([\d,]+(?:\.\d+)?)/i)||body.match(/bal(?:ance)?[^\d]{0,40}([\d,]+(?:\.\d+)?)/i)||body.match(/airtime[^\d]{0,40}([\d,]+(?:\.\d+)?)/i);
    clearTimeout(balWait);balWait=null;
    if(balSale)return advBalResult(x?parseFloat(x[1].replace(/,/g,'')):null);
    if(x)return setBal(parseFloat(x[1].replace(/,/g,'')));
    addLog('Balance reply not understood: '+body.replace(/\s+/g,' ').slice(0,120));return balFail('reply had no amount');
  }
  if(/airtime/i.test(body)&&/balance/i.test(body)&&(m=body.match(/airtime[^\d]{0,40}([\d,]+(?:\.\d+)?)/i)))return setBal(parseFloat(m[1].replace(/,/g,'')));
  if(/^ussd$/i.test(String(sender))){const a=sales.find(x=>x.status==='dialing');if(a)return a.steps?ussdStep(a,body):ussdOne(a,body)}
  if(/recommendation for/i.test(body)&&(m=body.match(/for\s+(\S+)\s+submitted successfully/i)))return gotSubmitted(normPhone(m[1]),body);
  if(/purchased a gift bundle/i.test(body)&&(m=body.match(new RegExp('for\\s+'+PH,'i'))))return gotSuccess(normPhone(m[1]),body);
  if(/recommendation failed/i.test(body)){m=body.match(new RegExp(PH));return gotFail(m?normPhone(m[1]):null,body,/already been recommended/i.test(body)?'Customer already recommended':body.trim().slice(0,160))}
  if(/\breceived\b/i.test(body)&&/\bconfirmed\b/i.test(body)){
    if(!mpesaSender(sender))return addLog('Ignored payment text from '+sender);
    if(set.readSim!=='both'&&slot!=null&&String(slot)!==set.readSim)return addLog('Ignored payment text from SIM '+(+slot+1));
    return gotPayment(body);
  }
  if(/safaricom/i.test(String(sender))){
    const pm=findPhone(body),ph=pm?normPhone(pm):null;
    const t=ph&&sales.find(x=>x.phone===ph&&Date.now()-x.t<15*60000);
    if(t){t.msg=String(body).replace(/\s+/g,' ').trim().slice(0,400);save();render();return addLog('Safaricom message saved to sale for '+ph)}
  }
  addLog('Unrecognised SMS from '+sender+': '+body.slice(0,100));
};

function firstName(n){return String(n||'').trim().split(/\s+/)[0]||''}
function smsName(body){
  const t=String(body||'');const f=t.match(/\bfrom\s+([\s\S]+)/i);
  if(!f)return '';
  const cut=f[1].split(/\s+on\s+\d|\s+at\s+\d{1,2}[:.]\d|\.\s+[A-Z]|\s+New\s+M-?PESA|\s+Transaction\s+cost|\s+Balance/i)[0];
  const w=cut.split(/\s+/).filter(x=>/^[A-Za-z][A-Za-z.'\-]*$/.test(x));
  return w.slice(0,1).join(' ').replace(/[.\s]+$/,'').toLowerCase().replace(/(^|[ .'\-])([a-z])/g,(x,a,b)=>a+b.toUpperCase()).slice(0,40);
}
async function gotPayment(body){
  const code=(body.match(/\b(?=[A-Z0-9]*[A-Z])[A-Z0-9]{10}\b/)||[])[0]||('NOCODE'+uid());
  if(sales.some(s=>s.code===code)||seen.includes(code))return addLog('Duplicate ignored: '+code);seen.push(code);seen=seen.slice(-400);W('bs_seen',seen);
  const am=body.match(/(?:Ksh|KES)\.?\s?([\d,]+(?:\.\d+)?)/i);
  const pm=findPhone(body);
  const amount=am?parseFloat(am[1].replace(/,/g,'')):0;
  const phone=pm?normPhone(pm):null;
  if(window.Web&&await Web.claims(code,amount,phone))return addLog('Website payment '+code+' is handled by its web order');
  const o=offers.find(x=>x.on&&x.amount===amount);
  const s={id:uid(),code,amount,phone,client:smsName(body),name:o?o.name:'',ussd:'',status:'queued',reason:'',t:Date.now(),ts:Date.now()};
  if(!phone)fail(s,'No valid phone number in the payment SMS');
  else if(!o)fail(s,'No active offer priced KSh '+amount);
  else build(s,o);
  sales.unshift(s);addLog('Payment '+code+' KSh '+amount+' from '+(phone||'?'));
  if(phone&&!o)textClient(s,'nooffer');   /* paid an amount with no active offer: the customer is told instead of left waiting */
  save();pump();render();
}
function fail(s,r){s.status='failed';s.reason=r;s.ts=Date.now();if(s.steps)endSession()}
const open=(ph,sts)=>sales.slice().reverse().find(s=>sts.includes(s.status)&&(!ph||s.phone===ph));
/* a sale that only timed out (no reply / no confirmation) is not really dead: a late Safaricom text can still settle it */
function lateOpen(ph){return ph?sales.slice().reverse().find(s=>s.status==='failed'&&s.soft&&s.phone===ph&&Date.now()-s.ts<6*3600e3):null}
function gotSubmitted(ph,body){let s=open(ph,['dialing','queued','pending']);if(!s&&(s=lateOpen(ph))){delete s.soft;s.reason='';addLog('Late "submitted" reply for '+ph+': sale is waiting for confirmation again')}if(!s)return addLog('Submitted reply with no matching sale: '+ph);s.msg=String(body||'').replace(/\s+/g,' ').trim().slice(0,400);s.status='pending';s.ts=Date.now();done()}
function gotSuccess(ph,body){let s=open(ph,['pending','dialing']),late=false;if(!s&&(s=lateOpen(ph)))late=true;if(!s)return addLog('Success reply with no matching sale: '+ph);if(body)s.msg=String(body).replace(/\s+/g,' ').trim().slice(0,400);s.status='success';s.reason='';delete s.soft;if(late){s.late=1;addLog('Late confirmation: '+ph+' was marked Failed but Safaricom confirmed it. Now Success - do not dial it again')}s.ts=Date.now();try{celebrate(s)}catch(e){}textClient(s,'ok');needBal=true;balAt=Date.now()+4000;done()}
function gotFail(ph,body,r){let s=open(ph,['dialing','pending']);if(!s&&(s=lateOpen(ph)))delete s.soft;if(!s)return addLog('Failure reply with no matching sale: '+(ph||'?'));s.msg=String(body||'').replace(/\s+/g,' ').trim().slice(0,400);fail(s,r);if(isDup(r))textClient(s,'dup');needBal=true;balAt=Date.now()+4000;done()}
/* ---------- texts to the customer ---------- */
const isDup=r=>/already\s+(?:been\s+)?recommended/i.test(String(r||''));
const smsSimSlot=()=>set.smsSim==='auto'?-1:+set.smsSim;
const fillMsg=(t,s)=>String(t||'').replace(/\{amount\}/gi,s.amount).replace(/\{phone\}/gi,s.phone||'').replace(/\{name\}/gi,s.name||'');
function sendText(to,msg){
  if(!hasBridge()||!NativeBridge.sendSms){addLog('TEST MODE - would text '+to+': '+msg);return 'test'}
  let r;try{r=NativeBridge.sendSms(to,msg,smsSimSlot())}catch(e){r='error: '+e}
  if(r==='ok')addLog('Texted '+to+': '+msg.slice(0,70));

function impNext(){
  const s=scan;if(!s)return;
  if(sales.some(x=>x.status==='queued')){return impStop('paused')}
  if(!s.q.length||s.nodes>=IMP_MAXN)return impStop('done');
  const it=s.q.shift();s.nodes++;
  s.cur={root:it.root,path:it.path,labels:it.labels,k:0,replies:[],stage:0,ts:Date.now()};
  render();
  try{if(NativeBridge.dialUssdWake)NativeBridge.dialUssdWake(s.cur.root,simSlot(),true);else NativeBridge.dialUssd(s.cur.root,simSlot())}
  catch(e){impStop('stopped')}
}
function impAfter(ms){const s=scan;endSession();setTimeout(()=>{if(scan===s)impNext()},ms||2500)}
function impReply(txt){
  const s=scan,c=s&&s.cur;if(!c)return;
  const full=String(txt||'').trim();c.ts=Date.now();c.replies.push(full.slice(0,400));
  if(FAILRE.test(full)&&!impOpts(full).length)return impAfter();
  if(c.k<c.path.length){const i=c.k++;return setTimeout(()=>{if(scan!==s||s.cur!==c)return;try{NativeBridge.replyUssd(c.path[i])}catch(e){impAfter()}},spd()[0])}
  const opts=impOpts(full);
  if(c.stage===1){                       /* screen after the client number: pick airtime, never M-Pesa */
    const f=opts.find(o=>/airtime/i.test(o.label));
    if(!f)return impAfter();
    c.air=f.key;c.stage=2;
    return setTimeout(()=>{if(scan!==s||s.cur!==c)return;try{NativeBridge.replyUssd(f.key)}catch(e){impAfter()}},spd()[0]);
  }
  if(c.stage===2){                       /* confirm screen: only note the Accept key, never press it */
    const a=opts.find(o=>IMP_ACCEPT.test(o.label));
    if(a){
      const steps=[c.root].concat(c.path,['n',c.air,a.key]);
      const nm=c.labels.filter(l=>!/^(next|more)/i.test(l));
      const name=(nm[nm.length-1]||'Offer').replace(/\s+/g,' ').slice(0,60);
      let k=impSlug(nm);while(s.items.some(x=>x.k===k))k+='-2';
      s.items.push({k,name,cost:impPrice(nm.slice().reverse().concat([c.prompt||''])),steps,menus:c.replies.map(menuSig),last:full,
        trail:c.replies.map((m,i)=>({did:i===0?'Dialed '+steps[0]:'Sent '+steps[i],menu:m}))});
    }else addLog('Scan: no Accept option for '+(c.labels[c.labels.length-1]||'an offer')+', skipped');
    return impAfter();
  }
  if(!opts.length&&impPrompt(full)){
    c.stage=1;c.prompt=full;
    return setTimeout(()=>{if(scan!==s||s.cur!==c)return;try{NativeBridge.replyUssd(s.n)}catch(e){impAfter()}},spd()[0]);
  }
  if(opts.length&&c.path.length<IMP_MAXD){
    let ch=opts.filter(o=>!IMP_DENY.test(o.label)&&!/airtime/i.test(o.label)&&!/^0{1,2}$/.test(o.key));
    const pag=ch.filter(o=>/^(more|next)/i.test(o.label));
    if(!c.labels.some(l=>IMP_GIFT.test(l))){           /* still looking for the gift menu: follow Gift, else More */
      const g=ch.filter(o=>IMP_GIFT.test(o.label));
      if(g.length)ch=g.concat(pag.filter(o=>!g.includes(o)));else if(pag.length)ch=pag;
    }
    ch.forEach(o=>{const p=c.path.concat([o.key]),id=c.root+'>'+p.join('>');if(s.seen[id])return;s.seen[id]=1;s.q.push({root:c.root,path:p,labels:c.labels.concat([o.label])})});
  }
  impAfter();
}
function impOffer(it){return offers.find(o=>o.adv&&o.impKey===it.k)||offers.find(o=>o.adv&&advCode(o.steps)===advCode(it.steps))}
function impStatus(it){
  const o=impOffer(it);if(!o)return 'new';
  if(advCode(o.steps)!==advCode(it.steps)||(o.menus&&JSON.stringify(o.menus)!==JSON.stringify(it.menus)))return 'changed';
  return 'done';
}
function impFind(k){return (scan?scan.items:[]).concat(imp.items).find(x=>x.k===k)}
function impImport(k){
  const it=impFind(k);if(!it)return;
  const ex=impOffer(it);
  let cost=it.cost!=null?it.cost:(ex?ex.cost:null);
  if(!(cost>0)){const x=prompt('Safaricom price for '+it.name+' (KSh)','');if(x===null)return;cost=+x;if(!(cost>0))return toast('Enter a valid price')}
  const amount=ex&&ex.amount>0?ex.amount:cost;
  const cal={t:Date.now(),state:'ok',msg:'Imported',trail:it.trail};
  let o=ex;
  if(o){Object.assign(o,{steps:it.steps,menus:it.menus,cost,cal,impKey:k,on:true});delete o.cal.paused}
  else{o={id:uid(),name:it.name,amount,cost,steps:it.steps,adv:true,on:true,impKey:k,menus:it.menus,cal};offers.push(o)}
  offers.sort((a,b)=>a.amount-b.amount);
  addLog('Imported '+o.name);toast('Added to Advanced offers');save();fresh=false;render();
}
function impCount(){return imp.items.filter(it=>impStatus(it)!=='done').length}
function impView(){
  const sc=scan,btn=sc?'<button class="btn d" onclick="impStop(\'stopped\')">Stop</button>':'<button class="btn p" onclick="impStart()">Scan now</button>';
  const st=sc?'Scanning '+sc.nodes+' · found '+sc.items.length:(imp.t?'Last scan '+tm(imp.t):'Not scanned yet');
  const head='<div class="tools own">'+btn+'<span class="hint" style="align-self:center">'+st+'</span></div>'
    +'<div class="own"><label class="f" for="icode">Menu codes</label><input type="text" id="icode" inputmode="text" autocapitalize="off" value="'+esc(set.impCode||IMP_ROOTS)+'" onchange="set.impCode=this.value.trim()||IMP_ROOTS;save()">'
    +'<label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" '+(set.impAuto!==false?'checked':'')+' onchange="set.impAuto=this.checked;save()" style="width:auto">Scan automatically every day</label></div>';
  const gone=sc?[]:offers.filter(o=>o.adv&&o.impKey&&imp.t&&!imp.items.some(it=>it.k===o.impKey));
  const list=sc?sc.items:imp.items;
  const rows=list.slice().sort((a,b)=>(a.cost||0)-(b.cost||0)).map(it=>{
    const stt=impStatus(it);
    const chip=stt==='new'?'':stt==='changed'?chipH('a','Changed'):chipH('g','Added');
    const act=stt==='done'?'':'<button class="btn p own" aria-label="'+(stt==='new'?'Import':'Update')+' '+esc(it.name)+'" title="'+(stt==='new'?'Import':'Update')+'" onclick="impImport(\''+it.k+'\')" style="font-size:18px;min-width:44px">'+(stt==='new'?'\u2B07':'\u21BB')+'</button>';
    return '<li class="oc"><div class="oc-h"><div class="amt">'+(it.cost!=null?it.cost:'?')+'<small>KSh</small></div><div class="mid"><b>'+esc(it.name)+'</b><div class="chips" style="margin-top:6px"><span class="sc d">'+esc(advCode(it.steps))+'</span></div></div>'+chip+act+'</div></li>';
  }).join('');
  const goneH=gone.length?'<div class="grp">Not in menu · '+gone.length+'</div><ul>'+gone.map(o=>'<li class="oc off"><div class="oc-h"><div class="amt">'+o.amount+'<small>KSh</small></div><div class="mid"><b>'+esc(o.name)+'</b></div>'+chipH('r','Gone')+'</div>'+(o.on?'<div class="oc-b own"><button class="btn" onclick="togOffer(\''+o.id+'\')">\u23F8 Pause</button></div>':'')+'</li>').join('')+'</ul>':'';
  return head+(rows?'<ul>'+rows+'</ul>':'<p class="empty"><big></big>'+(sc?'Scanning...':'No offers found yet.')+'</p>')+goneH;
}

function balFail(why){
  clearTimeout(balWait);balWait=null;
  if(balTry<2){balTry++;needBal=true;balAt=Date.now()+15000;addLog('Balance check failed ('+why+'). Trying again in 15 seconds')}

function profitOf(x){
  if(x.adv===undefined){const o=offers.find(q=>q.name===x.name&&q.amount===x.amount)||offers.find(q=>q.amount===x.amount);x.adv=!!(o&&o.adv);if(o&&o.adv&&x.cost==null)x.cost=o.cost}
  if(x.adv)return x.cost!=null?x.amount-x.cost:0;

}

/* *444*5*3*2*1*n*2#  ->  ["*444#","5","3","2","1","n","2"] */
function parseUssd(code){
  const c=String(code||'').replace(/\s+/g,'');
  if(!/^\*[0-9a-z*]+#$/i.test(c))return null;
  const p=c.slice(1,-1).split('*');
  if(p.length<2||p.some(x=>!x))return null;
  return ['*'+p[0]+'#'].concat(p.slice(1));
}
function advCode(steps){
  if(!steps||!steps.length)return '';
  return steps[0].replace(/#$/,'')+(steps.length>1?'*'+steps.slice(1).join('*'):'')+'#';
}
function advPreview(){
  const e=$('#aPrev'),c=$('#aCode').value.trim();
  if(!c){e.textContent='';return}
  const st=parseUssd(c);
  if(!st){e.textContent='Check the code: it must start with *, end with #, and have at least one reply after the first part.';return}
  e.innerHTML='Dial <b>'+esc(st[0])+'</b>'+st.slice(1).map((x,i)=>'<br>Step '+(i+1)+': select <b>'+esc(/^n$/i.test(x)?'phone number':x)+'</b>').join('')+'<br>Then done.';
}
function saveAdv(){
  const name=$('#aName').value.trim(),amount=+$('#aAmt').value,cost=+$('#aCost').value,id=$('#aId').value;
  const steps=parseUssd($('#aCode').value);
  if(!name||!(cost>0)||!(amount>0)||!steps||!steps.some(x=>/^n$/i.test(x)))return toast('Add a name, both prices and a full code like *444*5*3*n*2#');
  if(amount<cost)return toast('Your price is below the Safaricom price');
  let o,run=false;
  if(id){o=offers.find(x=>x.id===id);run=advCode(o.steps)!==advCode(steps)||!o.cal;Object.assign(o,{name,amount,cost,steps});delete o.expect;if(run)delete o.menus;if(run)delete o.cal}
  else{o={id:uid(),name,amount,cost,steps,adv:true,on:true};offers.push(o);run=true}
  offers.sort((a,b)=>a.amount-b.amount);save();adlg.close();render();
  if(run)setTimeout(()=>calStart(o.id),300);
}

const Web=(()=>{
  const on=()=>!!(set.webOn&&set.webUrl&&set.webKey);
  /* every website call has a time limit, so a slow or sleeping server can never hang Bn */
  const api=async(p,o={})=>{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),o.ms||8000);try{const r=await fetch(set.webUrl.replace(/\/+$/,'')+p,{method:o.method||'GET',headers:{'Content-Type':'application/json','x-shop-key':set.webKey},body:o.body,signal:ac.signal});if(!r.ok)throw new Error(r.status===401?'wrong shop key':'error '+r.status);return await r.json()}catch(e){if(e&&e.name==='AbortError')throw new Error('website not answering');throw e}finally{clearTimeout(to)}};
  let last='',pend=[],busy=false;
  async function publish(){const b=JSON.stringify(offers.filter(o=>o.on).map(o=>({id:o.id,name:o.name,amount:o.amount})));if(b===last)return;await api('/api/offers',{method:'PUT',body:b});last=b}
  let pt2=null,pubBusy=false;
  function publishSoon(){
    if(!on())return;
    clearTimeout(pt2);
    pt2=setTimeout(async()=>{
      if(pubBusy)return publishSoon();
      pubBusy=true;
      try{const was=last;await publish();if(last!==was)addLog('Website offers updated')}
      catch(e){addLog('Website offers not updated: '+e.message);pt2=setTimeout(publishSoon,8000)}
      pubBusy=false;
    },1200);
  }
  async function take(w){
    const code=w.receipt||('WEB'+w.id);
    /* already handled from the M-Pesa text (same receipt code, or no receipt but same payer and amount a moment ago) */
    const handled=sales.some(x=>x.code===code)||(!w.receipt&&sales.some(x=>!x.web&&x.amount===w.amount&&x.phone===normPhone(w.buyer)&&Date.now()-x.t<600000));
    if(!handled){
      const o=offers.find(x=>x.id===w.offerId)||offers.find(x=>x.on&&x.amount===w.amount),ph=normPhone(w.to);
      const s={id:uid(),code,amount:w.amount,phone:ph,client:'Website',name:o?o.name:w.name,ussd:'',status:'queued',reason:'',t:Date.now(),ts:Date.now(),web:1};
      if(!ph)fail(s,'Invalid number on web order');else if(!o)fail(s,'Offer no longer exists');else build(s,o);
      sales.unshift(s);addLog('Website order '+w.id+': KSh '+w.amount+' for '+w.to);save();pump();render();
    }
    await api('/api/orders/'+w.id+'/ack',{method:'POST'});
  }
  /* instant: hold a request open; the server answers the moment a payment is confirmed */
  let looping=false;
  async function loop(){
    if(looping)return;looping=true;
    while(on()){
      try{const d=await api('/api/orders/open?wait=1',{ms:35000});pend=d.pending||[];for(const w of d.paid||[])await take(w)}
      catch(e){await new Promise(r=>setTimeout(r,5000))}
    }
    looping=false;
  }
  async function sync(){
    if(on())loop();
    if(!on()||busy)return;busy=true;
    try{await publish();const d=await api('/api/orders/open');pend=d.pending||[];for(const w of d.paid||[])await take(w)}
    catch(e){addLog('Website sync: '+e.message)}
    busy=false;
  }
  /* true when an incoming M-Pesa SMS belongs to a website order (that order creates the sale instead) */
  async function refresh(ms){const d=await api('/api/orders/open',{ms});pend=d.pending||[];for(const w of d.paid||[])await take(w)}
  async function claims(code,amount,phone){
    if(!on())return false;
    /* ask the website, but wait at most 4 seconds: a slow server must never hold a paying customer back */
    let tm;
    try{await Promise.race([refresh(4000),new Promise((_,no)=>{tm=setTimeout(()=>no(new Error('slow')),4000)})])}
    catch(e){addLog('Website not answering ('+e.message+'). Handling payment '+code+' without it')}
    finally{clearTimeout(tm)}
    if(sales.some(x=>x.code===code))return true;
    const m=pend.filter(x=>x.amount===amount&&(!phone||normPhone(x.buyer)===phone));
    return m.length>0&&(!!phone||m.length===1);
  }
  async function test(){
    try{await api('/api/orders/open');last='';await publish();toast('Website connected');}catch(e){toast('Website: '+e.message)}
  }
  setInterval(sync,15000);setTimeout(sync,3000);
  return{sync,claims,test,on,publishSoon};
})();

  const FSB=()=>'https://firestore.googleapis.com/v1/projects/'+cfg.projectId+'/databases/(default)/documents';
  const nice=m=>{m=String(m||'');
    if(/EMAIL_EXISTS/.test(m))return 'That email already has an account.';
    if(/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL|MISSING_PASSWORD/.test(m))return 'Wrong email or password.';
    if(/WEAK_PASSWORD/.test(m))return 'Password must be at least 6 characters.';
    if(/TOO_MANY/.test(m))return 'Too many tries. Wait a few minutes.';
    if(/USER_DISABLED/.test(m))return 'This account has been disabled.';
    if(/Failed to fetch|NetworkError|abort/i.test(m))return 'No internet connection.';
    if(/permission/i.test(m))return 'Not allowed. Check the Firestore rules.';
    return m||'Something went wrong.'};
  async function api(url,o){
    o=o||{};const ac=new AbortController();const to=setTimeout(()=>ac.abort(),20000);
    try{
      const r=await fetch(url,{method:o.method||'GET',headers:Object.assign({'Content-Type':'application/json'},o.headers||{}),body:o.body,signal:ac.signal});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){const e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.status=r.status;throw e}
      return j;
    }finally{clearTimeout(to)}
  }
  const authCall=(op,b)=>api(AUTH+op+KEY,{method:'POST',body:JSON.stringify(b)});
  function setSes(j,email){
    T.ses={tok:j.idToken||j.id_token,ref:j.refreshToken||j.refresh_token,uid:j.localId||j.user_id,exp:Date.now()+(+(j.expiresIn||j.expires_in||3600))*1000-60000,email:email||j.email||(T.ses&&T.ses.email)||''};
    W('bn_ses',T.ses);
  }
  async function token(){
    if(!T.ses)throw new Error('Not signed in');
    if(Date.now()<T.ses.exp)return T.ses.tok;
    const j=await api('https://securetoken.googleapis.com/v1/token'+KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(T.ses.ref)});
    setSes(j);return T.ses.tok;
  }
  /* Firestore value helpers */
  const enc=v=>v===null||v===undefined?{nullValue:null}:typeof v==='number'?(Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v}):typeof v==='boolean'?{booleanValue:v}:{stringValue:String(v)};
  const encDoc=o=>({fields:Object.fromEntries(Object.entries(o).map(([k,v])=>[k,enc(v)]))});
  const dec=f=>f.stringValue!==undefined?f.stringValue:f.integerValue!==undefined?+f.integerValue:f.doubleValue!==undefined?f.doubleValue:f.booleanValue!==undefined?f.booleanValue:null;
  const decDoc=d=>d&&d.fields?Object.fromEntries(Object.entries(d.fields).map(([k,v])=>[k,dec(v)])):{};
  async function fsGet(path){
    const t=await token();
    try{return decDoc(await api(FSB()+'/'+path,{headers:{Authorization:'Bearer '+t}}))}
    catch(e){if(e.status===404)return null;throw e}
  }
  async function fsSet(path,obj,mask){
    const t=await token();
    const q=mask?'?'+mask.map(m=>'updateMask.fieldPaths='+encodeURIComponent(m)).join('&'):'';
    return api(FSB()+'/'+path+q,{method:'PATCH',headers:{Authorization:'Bearer '+t},body:JSON.stringify(encDoc(obj))});
  }
  async function fsQuery(coll,filters){
    const t=await token();
    const F=([k,v])=>({fieldFilter:{field:{fieldPath:k},op:'EQUAL',value:enc(v)}});
    const where=filters.length===1?F(filters[0]):{compositeFilter:{op:'AND',filters:filters.map(F)}};
    const r=await api(FSB()+':runQuery',{method:'POST',headers:{Authorization:'Bearer '+t},body:JSON.stringify({structuredQuery:{from:[{collectionId:coll}],where,limit:500}})});
    return r.filter(x=>x.document).map(x=>Object.assign(decDoc(x.document),{_id:x.document.name.split('/').pop()}));
  }
  const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const isOwner=()=>!!(T.on&&T.me&&T.me.role==='owner');

  /* ---------- who is using the app ---------- */
  function applyRole(){
    document.body.classList.toggle('att',!!(T.on&&T.me&&T.me.role==='attendant'));
    const tb=document.querySelector('nav button[data-t=team]');if(tb)tb.hidden=!isOwner();
    if(tab==='team'&&!isOwner())tab='home';
    const g=$('#gate');if(g)g.hidden=!T.on||!!(T.ses&&T.me);
  }
  function signOut(){
    T.ses=null;T.me=null;T.users=[];T.tsales=[];
    try{localStorage.removeItem('bn_ses');localStorage.removeItem('bn_me')}catch(e){}
    applyRole();render();
  }
  async function loadMe(strict){
    const d=await fsGet('users/'+T.ses.uid);
    if(!d){if(strict){signOut();throw new Error('No access yet. Ask the owner to add you.')}return}
    if(d.active===false){signOut();gerr('Your account is switched off. Contact the owner.');throw new Error('Your account is switched off. Contact the owner.')}
    T.me={role:d.role,name:d.name||'',ownerUid:d.ownerUid,email:d.email||T.ses.email,uid:T.ses.uid};
    W('bn_me',T.me);applyRole();
  }
  function gerr(m){const e=$('#gerr');if(e)e.textContent=m||''}
  function toggleMode(){
    T.gateNew=!T.gateNew;
    $('#gname').hidden=!T.gateNew;
    $('#gbtn').textContent=T.gateNew?'Create owner account':'Sign in';
    $('#gmode').textContent=T.gateNew?'Set up the owner account for your shop':'Sign in to continue';
    $('#gswitch').textContent=T.gateNew?'I already have an account':'New shop? Create the owner account';
    gerr('');
  }
  async function submit(){
    const email=$('#gemail').value.trim(),pw=$('#gpw').value,name=$('#gname').value.trim();
    if(!email||!pw)return gerr('Type your email and password.');
    if(T.gateNew&&!name)return gerr('Type your name.');
    const b=$('#gbtn');b.disabled=true;gerr('');
    try{
      if(T.gateNew){
        const j=await authCall('signUp',{email,password:pw,returnSecureToken:true});
        setSes(j,email);
        await fsSet('users/'+T.ses.uid,{email,name,role:'owner',ownerUid:T.ses.uid,active:true,createdAt:Date.now(),lastSeen:Date.now()});
      }else{
        const j=await authCall('signInWithPassword',{email,password:pw,returnSecureToken:true});
        setSes(j,email);
      }
      await loadMe(true);
      $('#gpw').value='';
      render();tick();
    }catch(e){if(!/switched off/.test(e.message))gerr(nice(e.message))}
    finally{b.disabled=false}
  }
  async function forgot(){
    const email=$('#gemail').value.trim();
    if(!email)return gerr('Type your email first, then tap Forgot password.');
    try{await authCall('sendOobCode',{requestType:'PASSWORD_RESET',email});gerr('A reset link was sent to '+email+'.')}catch(e){gerr(nice(e.message))}
  }

  /* ---------- background sync ---------- */
  async function pushOffers(){
    const j=JSON.stringify(offers);
    if(j===localStorage.getItem('bn_oh'))return;
    await fsSet('offers/'+T.ses.uid,{json:j,v:Date.now()});
    localStorage.setItem('bn_oh',j);
  }
  async function pullOffers(){
    const d=await fsGet('offers/'+T.me.ownerUid);
    if(d&&d.json&&String(d.v)!==localStorage.getItem('bn_ov')){
      offers=JSON.parse(d.json);W('bs_offers',offers);localStorage.setItem('bn_ov',String(d.v));render();
    }
  }
  const sig=s=>s.status+'|'+s.ts;
  const recent=s=>s.t>Date.now()-7*864e5;
  async function pushSales(){
    let n=0;
    try{
      for(const s of sales){
        if(!recent(s)||T.pushed[s.id]===sig(s))continue;
        if(++n>25)break;
        await fsSet('sales/'+T.ses.uid.slice(0,8)+'_'+String(s.id).replace(/[^A-Za-z0-9_-]/g,''),{
          ownerUid:T.me.ownerUid,uid:T.ses.uid,by:T.me.name||T.me.email||'',day:dayKey(s.t),t:s.t,ts:s.ts,
          amount:s.amount,phone:s.phone||'',client:s.client||'',offer:s.name||'',status:s.status,reason:s.reason||'',code:s.code||''});
        T.pushed[s.id]=sig(s);
      }
    }finally{W('bn_pushed',T.pushed)}
  }
  async function tick(){
    if(!T.on||!T.ses||!T.me||T.busy)return;
    T.busy=true;
    try{
      await loadMe(false);
      if(!T.ses)return;
      const now=Date.now();
      if(now-(T.seen||0)>300000){T.seen=now;fsSet('users/'+T.ses.uid,{lastSeen:now},['lastSeen']).catch(()=>{})}
      if(isOwner())await pushOffers();else await pullOffers();
      await pushSales();
    }catch(e){T.err=e.message}
    finally{T.busy=false}
  }
  function dirty(){
    if(!T.on||!T.ses||!T.me||T._t)return;
    let need=sales.some(s=>recent(s)&&T.pushed[s.id]!==sig(s));
    if(!need&&isOwner())need=JSON.stringify(offers)!==localStorage.getItem('bn_oh');
    if(need)T._t=setTimeout(()=>{T._t=0;tick()},3000);
  }

  /* ---------- owner: team screen ---------- */
  async function load(force){
    if(!isOwner()||T.loading)return;
    if(!force&&Date.now()-T.loadedAt<30000)return;
    T.loading=true;
    try{
      T.users=await fsQuery('users',[['ownerUid',T.ses.uid]]);
      const days=T.range==='today'?[0]:T.range==='yest'?[1]:[0,1,2,3,4,5,6];
      let all=[];
      for(const i of days){all=all.concat(await fsQuery('sales',[['ownerUid',T.ses.uid],['day',dayKey(startOf(i))]]))}
      T.tsales=all.sort((a,b)=>b.t-a.t);
      T.loadedAt=Date.now();T.err='';
    }catch(e){T.err=nice(e.message)}
    finally{T.loading=false;if(tab==='team')render()}
  }
  function setRange(r){T.range=r;T.loadedAt=0;T.tsales=[];fresh=true;render();load(true)}
  const ago=t=>{if(!t)return 'never';const m=Math.round((Date.now()-t)/60000);return m<2?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
  function view(){
    const v=$('#view');
    if(!isOwner()){v.innerHTML='';return}
    load();
    const per=(k,l)=>`<button class="${T.range===k?'on':''}" onclick="Team.setRange('${k}')">${l}</button>`;
    const people=[{uid:T.ses.uid,name:(T.me.name||'Owner')+' (you)',active:true,owner:true}].concat(T.users.filter(u=>u._id!==T.ses.uid).map(u=>({uid:u._id,name:u.name||u.email,email:u.email,active:u.active!==false,lastSeen:u.lastSeen})));
    const stat=p=>{const l=T.tsales.filter(s=>s.uid===p.uid),ok=l.filter(s=>s.status==='success');return{n:ok.length,sum:ok.reduce((a,s)=>a+s.amount,0),f:l.filter(s=>s.status==='failed').length}};
    const members=people.map(p=>{const s=stat(p);return `<li class="row o"><div class="amt">${fmt(s.sum)}<small>KSh</small></div><div class="mid"><b>${esc(p.name)}</b><span>${s.n} sold \u00B7 ${s.f} failed</span></div></li>`}).join('');
    const team=people.filter(p=>!p.owner).map(p=>`<li class="row ${p.active?'success':'failed'}"><div class="mid"><b>${esc(p.name)}</b><span>${esc(p.email||'')}</span><span>Last seen: ${ago(p.lastSeen)}</span><div class="btns"><button class="btn ${p.active?'d':''}" onclick="Team.setActive('${p.uid}',${!p.active})">${p.active?'\u23F8 Switch off':'\u25B6 Switch on'}</button><button class="btn" onclick="Team.reset('${esc(p.email||'')}')">\uD83D\uDD11 Reset password</button></div></div><div class="end"><span class="chip ${p.active?'g':'r'}">${p.active?'Active':'Off'}</span></div></li>`).join('');
    const recentRows=T.tsales.slice(0,40).map(s=>`<li class="row ${esc(s.status)}"><div class="amt">${s.amount}<small>KSh</small></div><div class="mid"><b>${esc(s.by||'')}</b><span>\uD83D\uDCF1 ${esc(s.phone||'')}</span><span>\uD83D\uDD52 ${tm(s.t)} \u00B7 ${esc([s.client,s.offer].filter(Boolean).join(' \u00B7 '))}</span>${s.reason?`<em>${esc(s.reason)}</em>`:''}</div><div class="end"><span class="chip ${s.status==='success'?'g':s.status==='failed'?'r':s.status==='queued'?'b':'a'}">${esc(s.status)}</span></div></li>`).join('');
    v.innerHTML=`<div class="hd"><h2 style="margin:12px 2px 6px">Team</h2><button class="btn" onclick="Team.load(true)">${T.loading?'Loading...':'\u21BB Refresh'}</button></div>
    <div class="per">${per('today','Today')}${per('yest','Yesterday')}${per('week','7 days')}</div>
    ${T.err?`<p class="note">${esc(T.err)}</p>`:''}
    <ul>${members}</ul>
    <div class="hd"><h2>People</h2><button class="btn p" onclick="Team.openAdd()">+ Add attendant</button></div>
    ${team?`<ul>${team}</ul>`:'<p class="empty"><big></big>No attendants yet. Add one so they can sell from their own phone.</p>'}
    <h2>Team sales</h2>${recentRows?`<ul>${recentRows}</ul>`:'<p class="hint">No sales in this period.</p>'}`;
  }
  function openAdd(){['tn','te','tp'].forEach(i=>$('#'+i).value='');$('#tmsg').textContent='';$('#tdlg').showModal()}
  async function addAttendant(){
    const name=$('#tn').value.trim(),email=$('#te').value.trim(),pw=$('#tp').value;
    if(!name||!email||pw.length<6)return $('#tmsg').textContent='Type a name, an email and a password of at least 6 characters.';
    const b=$('#tgo');b.disabled=true;$('#tmsg').textContent='Creating...';
    try{
      const j=await authCall('signUp',{email,password:pw,returnSecureToken:true});   /* the new account's own tokens are not used here */
      await fsSet('users/'+j.localId,{email,name,role:'attendant',ownerUid:T.ses.uid,active:true,createdAt:Date.now(),lastSeen:0});
      $('#tdlg').close();toast('Added '+name+'. Give them the email and password.');load(true);
    }catch(e){$('#tmsg').textContent=nice(e.message)}
    finally{b.disabled=false}
  }
  async function setActive(uid,on){
    if(!on&&!confirm('Switch this person off? They will not be able to sell or see sales.'))return;
    try{await fsSet('users/'+uid,{active:on},['active']);toast(on?'Switched on':'Switched off');load(true)}catch(e){toast(nice(e.message))}
  }
  async function reset(email){
    if(!email)return;
    try{await authCall('sendOobCode',{requestType:'PASSWORD_RESET',email});toast('Reset link sent to '+email)}catch(e){toast(nice(e.message))}
  }
  const account=()=>!T.on?'':`<h2 style="margin-top:12px">Account</h2><p class="hint">${T.me?'Signed in as <b>'+esc(T.me.name||T.me.email)+'</b> ('+(T.me.role==='owner'?'owner':'attendant')+') \u00B7 '+esc(T.me.email||''):'Not signed in'}</p><div class="btns"><button class="btn d" onclick="Team.out()">Sign out</button></div>`;
  function out(){if(confirm('Sign out? Bn will stop selling until you sign in again.'))signOut()}
  const canDial=()=>!T.on||!!(T.ses&&T.me);
  function init(){
    applyRole();
    if(T.on&&T.ses&&T.me){tick()}
    if(T.on){setInterval(tick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})}
  }
  return {T,init,submit,toggleMode,forgot,view,load,setRange,openAdd,addAttendant,setActive,reset,account,out,canDial,dirty,isOwner,_:{enc,decDoc,dayKey,fsSet,fsGet,fsQuery,tick,pushSales}};
})();
window.Team=Team;
Team.init();

$('#nav').onclick=e=>{const t=e.target.closest('button');if(!t)return;tab=t.dataset.t;fresh=true;render();if(tab==='settings')settingsView();window.scrollTo(0,0)};
$('#auto').onchange=e=>{set.auto=e.target.checked;save();toast(set.auto?'Auto-dial is ON':'Auto-dial is OFF');pump();render()};
render();pump();

/* slide the chosen sub tab into the middle of the bar */
(function(){const v=document.getElementById('view');if(!v||!window.MutationObserver)return;
  const c=()=>{const b=v.querySelector('.per.sub button.on');const bar=b&&b.parentElement;if(bar)bar.scrollLeft=b.offsetLeft-(bar.clientWidth-b.offsetWidth)/2};
  new MutationObserver(()=>requestAnimationFrame(c)).observe(v,{childList:true});c()})();
</script>
</body>
</html>
