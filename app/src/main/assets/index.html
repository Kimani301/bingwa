/* ---- v3 classic green ---- */
:root{--bg:#f4f2ea;--ink:#1d2a22;--mute:#6b7468;--line:#ddd9c9;--card:#fffef9;--hd:#166534;--hd2:#0f4a26;--pr:#166534;--pr2:#0f4a26;--prs:#e2efe5;--g:#166534;--gs:#e1efe4;--gold:#d4af37;--r:#9b1c2e;--rs:#f7e2e5;--a:#8a5a00;--as:#f6ecc9;--b:#1f3a5f;--bs:#e1e8f1;--onp:#fff;--sh:0 1px 2px rgba(20,40,25,.08);--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,"Times New Roman",serif}
[data-theme=dark]{--bg:#0e1511;--ink:#ecf1ec;--mute:#9aa89d;--line:#25332a;--card:#151f19;--hd:#0f3d20;--hd2:#0a2915;--pr:#4fb27a;--pr2:#2f8a58;--prs:#183326;--g:#5fd08f;--gs:#143524;--gold:#e0bd4a;--r:#ef6b7c;--rs:#3a1a21;--a:#e5bf6a;--as:#352b0f;--b:#7fa6d6;--bs:#18293f;--onp:#04200c;--sh:none}
body{padding:0}
header{padding:14px 16px 14px;border-radius:0;background:var(--hd);border-bottom:3px solid var(--gold);box-shadow:none}
.top{align-items:center;gap:14px}
.bal{flex:1;min-width:0;margin:0;padding:0;background:none;border:0;border-radius:0;box-shadow:none;color:#fff;gap:8px}
.bal .bl{min-width:0}
.bal small{color:rgba(255,255,255,.78);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.bal small#balt{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
.bal b{color:#fff;font:700 30px/1.2 var(--serif);margin:2px 0 1px}
.rf{color:var(--gold);font-size:22px}
.sw{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;opacity:1;color:rgba(255,255,255,.85)}
.sw em{font-style:normal;letter-spacing:.3px}
.sw .ad{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.4);color:rgba(255,255,255,.7);transition:.15s;position:relative}
.sw .ad:after{content:none}
.sw input:checked+.ad{background:var(--gold);border-color:var(--gold);color:#1d2a10;left:0}
.sw input:checked+.ad:after{content:none}
main{padding:14px 14px 118px}
h2{font:700 18px var(--serif);margin:22px 2px 8px}
h2:before{width:4px;height:18px;border-radius:2px;background:var(--gold)}
.row,.oc,.chartbox,.pk,details.cd{border-width:1px;border-radius:12px;box-shadow:var(--sh)}
.per{border-width:1px;border-radius:12px;padding:4px;margin:4px 0 8px}.per button{border-radius:9px}
.per button.on{background:var(--pr);color:#fff;box-shadow:none}
[data-theme=dark] .per button.on,[data-theme=dark] .btn.p{color:#04200c}
.stat{border-radius:12px;box-shadow:none}
.stat.s1{background:linear-gradient(160deg,#1d7a45,#124d29)}
.stat.s2{background:#c9a227;color:#2b2000}
.stat.s3{background:#1f3a5f}
.stat.s4{background:#8b1e2d}
.stat.tot{margin:12px 0 0;padding:16px 16px 12px}
.stat.s1.tot b{font:700 clamp(28px,8.5vw,36px)/1.15 var(--serif);margin:6px 0 12px}
.stat.tot small{text-transform:uppercase;letter-spacing:.5px;font-size:12px}
.stat.tot .per{background:rgba(0,0,0,.22);border:0;margin:0}
.stat.tot .per button{color:rgba(255,255,255,.82)}
.stat.tot .per button.on{background:#fffef9;color:#166534;box-shadow:none}
.stats{grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin:10px 0}
.stats .stat{padding:12px}
.stats .stat small{font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.stats .stat b{font:700 clamp(15px,4.8vw,21px)/1.15 var(--serif);margin:5px 0 2px}
.stats .stat span{font-size:11px;opacity:.9}
.amt{border-radius:10px;font-family:var(--serif)}
.row.o:nth-child(4n+1) .amt{background:#166534}.row.o:nth-child(4n+2) .amt{background:#1f3a5f}.row.o:nth-child(4n+3) .amt{background:#8a5a00}.row.o:nth-child(4n) .amt{background:#7a1f2e}
.btn{border-width:1px;border-radius:10px;box-shadow:none}.btn.p{box-shadow:none}.btn:active{transform:scale(.97)}
.oc-b .btn,.oc-b .btn.p{box-shadow:none}
.pk{box-shadow:none}.pk.on{box-shadow:none}
.ic.retry{border-radius:12px;box-shadow:none}

/* sale rows: compact, tap to open */
.row.sr{display:block;padding:0;overflow:hidden}
.sr-h{display:flex;gap:10px;align-items:center;padding:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sr-h .mid{justify-content:center}
.sr-h .end{flex-direction:row;align-items:center}
.sr-ar{color:var(--mute);font-size:16px;transition:transform .2s;flex:none}

.sr-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sr-g.one{grid-template-columns:1fr}
.sr-g>div{background:var(--bg,rgba(0,0,0,.04));border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.sr-d small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);margin-bottom:2px}
.sr-g b{font-size:14px;font-weight:700;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.sr-why{background:var(--rs);border-radius:10px;padding:8px 10px}.sr-why small{color:var(--r)}
.sr-why em{font-style:normal;font-size:13px;font-weight:600;color:var(--r);overflow-wrap:anywhere}
.sr-a{display:flex;gap:8px}.sr-a .btn{flex:1;min-height:42px;padding:6px 10px;font-size:14px;box-shadow:none}
.sr-a .btn.sr-retry{background:var(--pr);border-color:var(--pr);color:#fff}

/* organised tabs & sub-tabs */
#view>.per.sub{position:sticky;top:0;z-index:4;margin:0 -14px 12px;padding:8px 14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--bg);box-shadow:0 6px 10px -8px rgba(16,24,40,.25);gap:4px}
#view>.per.sub button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 4px;font-size:13px;white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--mute)}
#view>.per.sub button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.per.sub .cnt{font-style:normal;font-size:11px;font-weight:800;min-width:18px;line-height:18px;padding:0 5px;border-radius:9px;background:var(--line);color:var(--ink);text-align:center}
.per.sub button.on .cnt{background:rgba(255,255,255,.28);color:#fff}
[data-theme=dark] .per.sub button.on{color:#04200c}[data-theme=dark] .per.sub button.on .cnt{background:rgba(0,0,0,.2);color:#04200c}
#view>.per.sub~*:first-of-type{margin-top:0}
#view>.per.sub+.tools,#view>.per.sub+.grp{margin-top:4px}
#view>.per.sub+.hint{margin-top:0}
.grp{display:flex;align-items:center;gap:8px;margin:18px 4px 4px}.grp:after{content:"";flex:1;height:1px;background:var(--line)}
nav{border-radius:0;box-shadow:none;border-top:1px solid var(--line);padding:6px 6px 8px}
nav button,nav button:nth-child(n){--tc:var(--pr)}
nav svg{border-radius:14px}
nav button.on svg{box-shadow:none;color:#fff}
[data-theme=dark] nav button.on svg{color:#04200c}
dialog{border-width:1px;border-radius:16px}
.gcard{border-radius:16px;box-shadow:none}
input[type=text],input[type=number],input[type=password],textarea,select{border-width:1px;border-radius:10px}
#toast{bottom:84px}
@media(max-width:360px){header{padding:12px}.bal b{font-size:26px}main{padding:12px 12px 114px}}
</style>

    <label class="sw" aria-label="Auto-dial"><input type="checkbox" id="auto"><span class="ad"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/><path d="M14.05 2a9 9 0 0 1 8 7.94"/><path d="M14.05 6A5 5 0 0 1 18 10"/></svg></span><em>Auto-dial</em></label>

<script src="firebase-config.js"></script>
<script>
/* ===== NATIVE BRIDGE (what the Android wrapper must provide) =====
   1. NativeBridge.dialUssd(code, simSlot)  -> wrapper dials the code on that SIM (0 = SIM 1, 1 = SIM 2, -1 = phone default)
   2. Wrapper calls window.onSmsReceived(sender, "<sms text>", simSlot) for every incoming SMS (simSlot 0 or 1)
   2b. NativeBridge.replyUssd("2") sends a reply inside the USSD session that is open (used by Advanced offers);
       NativeBridge.endUssd() (optional) closes that session
   3. Wrapper calls window.onUssdResponse("<reply text>") with the on-screen reply of a USSD session
      (this is how the airtime balance reply from *144# is read).
   In a normal browser none of these exist, so the app runs in Test mode (dialing is simulated). */

const $=s=>document.querySelector(s);
const L=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

const DEF=[[19,'1GB - 1 hour',1],[20,'Bingwa 250MB - 24hrs',2],[48,'Bingwa 750MB - 24hrs',3],[49,'Bingwa 1.5GB - 3hrs',7],[51,'400MB - 7 days',4],[55,'Bingwa 1GB - till midnight',6],[99,'1.5GB - 24hrs',5]]
  .map(([a,n,k])=>({id:uid()+k,amount:a,name:n,ussd:'*180*5*2*n*'+k+'*1#',on:true}));
let offers=L('bs_offers',DEF), sales=L('bs_sales',[]), set=Object.assign({auto:true,wait:3,rate:10,balCode:'*144#',dialSim:'auto',readSim:'both',autoBal:true,theme:'light',speed:'balanced',smsOn:true,smsFailOn:true,smsSim:'auto',smsOk:'Your offer of Ksh{amount} has been successfully renewed.',smsDup:'Hi, the number {phone} has already been recommended today. Kindly send a new number.'},L('bs_set',{})), bal=L('bs_bal',null), logs=[], tab='home', per='today', sf='all', ot='normal';
const save=()=>{W('bs_offers',offers);W('bs_sales',sales.slice(0,500));W('bs_set',set);window.Team&&Team.dirty()};
const hasBridge=()=>!!(window.NativeBridge&&window.NativeBridge.dialUssd);

function applyTheme(){
  const d=set.theme==='dark'||(set.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme=d?'dark':'light';
  const tb=$('#tbtn');if(tb)tb.textContent=d?'\u2600\uFE0F':'\uD83C\uDF19';
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=d?'#0f3d20':'#166534';try{NativeBridge.setBars(d?'#0f3d20':'#166534',d?'#151f19':'#fffef9',d)}catch(e){}
}
function toggleTheme(){set.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme();const t=$('#th');if(t)t.value=set.theme}
applyTheme();
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme)}catch(e){}
function addLog(m){logs.unshift(tm(Date.now())+'  '+m);logs=logs.slice(0,80);const e=$('#loglist');if(e)e.innerHTML=logs.map(x=>'<div>'+esc(x)+'</div>').join('')}
function celebrate(s){
  toast('\uD83C\uDF89 Sold KSh '+s.amount+(s.phone?' to '+s.phone:''));
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#00c853','#ffc700','#1e88ff','#ff4757','#8e5cf7','#ff8a1f'];
  for(let i=0;i<28;i++){const d=document.createElement('div');d.className='cf';
    d.style.left=(4+Math.random()*92)+'vw';d.style.background=cols[i%cols.length];
    d.style.setProperty('--dx',(Math.random()*120-60)+'px');d.style.setProperty('--rot',(360+Math.random()*540)+'deg');
    d.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- phone + SMS parsing ---------- */
function normPhone(p){if(!p)return null;let d=String(p).replace(/\D/g,'');if(d.startsWith('254')&&d.length===12)d='0'+d.slice(3);else if(d.length===9&&/^[17]/.test(d))d='0'+d;return /^0[17]\d{8}$/.test(d)?d:null}
const PH='((?:\\+?254|0)[17]\\d{8})';

window.onSmsReceived=function(sender,body,slot){
  body=String(body||'');let m;
  if(cal&&/^ussd$/i.test(String(sender)))return calReply(body);
  if(balWait&&/^ussd$/i.test(String(sender))){
    const x=body.match(/(?:ksh|kes)\.?\s?([\d,]+(?:\.\d+)?)/i)||body.match(/bal(?:ance)?[^\d]{0,40}([\d,]+(?:\.\d+)?)/i)||body.match(/airtime[^\d]{0,40}([\d,]+(?:\.\d+)?)/i);
    clearTimeout(balWait);balWait=null;
    if(balSale)return advBalResult(x?parseFloat(x[1].replace(/,/g,'')):null);
    if(x)return setBal(parseFloat(x[1].replace(/,/g,'')));
    addLog('Balance reply not understood: '+body.replace(/\s+/g,' ').slice(0,120));return balFail('reply had no amount');
  }
  if(/airtime/i.test(body)&&/balance/i.test(body)&&(m=body.match(/airtime[^\d]{0,40}([\d,]+(?:\.\d+)?)/i)))return setBal(parseFloat(m[1].replace(/,/g,'')));
  if(/^ussd$/i.test(String(sender))){const a=sales.find(x=>x.status==='dialing');if(a)return a.steps?ussdStep(a,body):ussdOne(a,body)}
  if(/recommendation for/i.test(body)&&(m=body.match(/for\s+(\S+)\s+submitted successfully/i)))return gotSubmitted(normPhone(m[1]),body);
  if(/purchased a gift bundle/i.test(body)&&(m=body.match(new RegExp('for\\s+'+PH,'i'))))return gotSuccess(normPhone(m[1]));
  if(/recommendation failed/i.test(body)){m=body.match(new RegExp(PH));return gotFail(m?normPhone(m[1]):null,/already been recommended/i.test(body)?'Customer already recommended':body.trim().slice(0,160))}
  if(/received/i.test(body)&&/confirmed/i.test(body)){
    if(!/mpesa/i.test(String(sender||'')))return addLog('Ignored payment text from '+sender);
    if(set.readSim!=='both'&&slot!=null&&String(slot)!==set.readSim)return addLog('Ignored payment text from SIM '+(+slot+1));
    return gotPayment(body);
  }
  addLog('Unrecognised SMS from '+sender+': '+body.slice(0,100));
};

function smsName(body){
  const t=String(body||'');const f=t.match(/\bfrom\s+([\s\S]+)/i);
  if(!f)return '';
  const cut=f[1].split(/\s+on\s+\d|\s+at\s+\d{1,2}[:.]\d|\.\s+[A-Z]|\s+New\s+M-?PESA|\s+Transaction\s+cost|\s+Balance/i)[0];
  const w=cut.split(/\s+/).filter(x=>/^[A-Za-z][A-Za-z.'\-]*$/.test(x));
  return w.join(' ').replace(/[.\s]+$/,'').toLowerCase().replace(/(^|[ .'\-])([a-z])/g,(x,a,b)=>a+b.toUpperCase()).slice(0,40);
}
function gotPayment(body){
  const code=(body.match(/\b(?=[A-Z0-9]*[A-Z])[A-Z0-9]{10}\b/)||[])[0]||('NOCODE'+uid());
  if(sales.some(s=>s.code===code))return addLog('Duplicate ignored: '+code);
  const am=body.match(/Ksh\.?\s?([\d,]+(?:\.\d+)?)/i);
  const pm=body.match(new RegExp(PH));
  const amount=am?parseFloat(am[1].replace(/,/g,'')):0;
  const phone=pm?normPhone(pm[1]):null;
  const o=offers.find(x=>x.on&&x.amount===amount);
  const s={id:uid(),code,amount,phone,client:smsName(body),name:o?o.name:'',ussd:'',status:'queued',reason:'',t:Date.now(),ts:Date.now()};
  if(!phone)fail(s,'No valid phone number in the payment SMS');
  else if(!o)fail(s,'No active offer priced KSh '+amount);
  else build(s,o);
  sales.unshift(s);addLog('Payment '+code+' KSh '+amount+' from '+(phone||'?'));
  save();pump();render();
}
function fail(s,r){s.status='failed';s.reason=r;s.ts=Date.now();if(s.steps)endSession()}
const open=(ph,sts)=>sales.slice().reverse().find(s=>sts.includes(s.status)&&(!ph||s.phone===ph));
function gotSubmitted(ph){const s=open(ph,['dialing','queued','pending']);if(!s)return addLog('Submitted reply with no matching sale: '+ph);s.status='pending';s.ts=Date.now();done()}
function gotSuccess(ph){const s=open(ph,['pending','dialing']);if(!s)return addLog('Success reply with no matching sale: '+ph);s.status='success';s.reason='';s.ts=Date.now();try{celebrate(s)}catch(e){}textClient(s,'ok');needBal=true;balAt=Date.now()+4000;done()}
function gotFail(ph,r){const s=open(ph,['dialing','pending']);if(!s)return addLog('Failure reply with no matching sale: '+(ph||'?'));fail(s,r);if(isDup(r))textClient(s,'dup');needBal=true;balAt=Date.now()+4000;done()}
/* ---------- texts to the customer ---------- */
const isDup=r=>/already\s+(?:been\s+)?recommended/i.test(String(r||''));
const smsSimSlot=()=>set.smsSim==='auto'?-1:+set.smsSim;
const fillMsg=(t,s)=>String(t||'').replace(/\{amount\}/gi,s.amount).replace(/\{phone\}/gi,s.phone||'').replace(/\{name\}/gi,s.name||'');
function sendText(to,msg){
  if(!hasBridge()||!NativeBridge.sendSms){addLog('TEST MODE - would text '+to+': '+msg);return 'test'}
  let r;try{r=NativeBridge.sendSms(to,msg,smsSimSlot())}catch(e){r='error: '+e}
  if(r==='ok')addLog('Texted '+to+': '+msg.slice(0,70));
  else{addLog('Could not text '+to+' ('+r+')');toast(r==='no_permission'?'Allow SMS permission for Bn to text customers':'Could not text the customer')}
  return r;
}
/* kind: 'ok' = bundle renewed, 'dup' = number already recommended. Each sale texts each kind at most once. */
function textClient(s,kind){
  if(window.Team&&!Team.canDial())return;
  const flag=kind==='ok'?'smsOk':'smsDup';
  if(s[flag]||!s.phone)return;
  const on=kind==='ok'?set.smsOn:set.smsFailOn,tpl=kind==='ok'?set.smsOk:set.smsDup;
  const msg=fillMsg(tpl,s).trim();
  if(!on||!msg)return;
  s[flag]=1;sendText(s.phone,msg);
}
function smsTest(){
  const x=prompt('Send a test of both messages to this number (use your own):',set.calNum||'');if(x===null)return;
  const n=normPhone(x);if(!n)return toast('Enter a valid number like 0712345678');
  const s={amount:22,phone:n,name:'Test offer'};
  sendText(n,fillMsg(set.smsOk,s));setTimeout(()=>sendText(n,fillMsg(set.smsDup,s)),2500);
  toast('Test messages sent to '+n);
}
function done(){nextAt=Date.now()+spd()[1];save();pump();render()}

/* ---------- dialing (one USSD at a time, no automatic retries) ---------- */
let balWait=null,needBal=false,balAt=0,balTry=0;
let cal=null,calQ=[],calSum=[];
const SPD={fast:[100,150],balanced:[250,350],safe:[600,900]};/* [ms before each reply step, ms gap between customers] */
const spd=()=>SPD[set.speed]||SPD.balanced;
let nextAt=0,pt=null;
const simSlot=()=>set.dialSim==='auto'?-1:+set.dialSim;
const busy=()=>!!balWait||!!cal||sales.some(s=>s.status==='dialing');
function build(s,o){
  s.name=o.name;
  if(o.adv){s.steps=o.steps.map(t=>t.replace(/\bn\b/gi,s.phone));s.ussd=s.steps[0]}
  else{delete s.steps;s.ussd=o.ussd.replace(/\bn\b/i,s.phone)}
}
const FAILRE=/(invalid|incorrect|unable|insufficient|not (?:allowed|eligible|available|registered)|failed|error|connection problem|already|unsuccessful)/i;
function endSession(){try{if(hasBridge()&&NativeBridge.endUssd)NativeBridge.endUssd()}catch(e){}}
function ussdStep(s,txt){
  addLog('USSD step '+(s.step+1)+' reply: '+txt.replace(/\s+/g,' ').slice(0,90));
  if(FAILRE.test(txt)){const why=txt.replace(/\s+/g,' ').trim().slice(0,160);fail(s,why);if(isDup(why))textClient(s,'dup');return done()}
  s.step++;s.ts=Date.now();
  if(s.step<s.steps.length){
    const i=s.step;
    save();render();
    setTimeout(()=>{
      if(s.status!=='dialing'||s.step!==i)return;
      if(hasBridge()){try{NativeBridge.replyUssd(s.steps[i])}catch(e){fail(s,'Could not send step '+(i+1));return done()}}
      else addLog('TEST MODE - would reply: '+s.steps[i]);
    },spd()[0]);
  }else{s.status='pending';endSession();advCheckBalance(s);done()}
}
/* ---------- advanced offers: confirm success by airtime deduction, not the gift-bundle SMS (that text is only sent for normal offers) ---------- */
let balSale=null,balSaleTry=0;
function advCheckBalance(s){
  if(!hasBridge()||!set.balCode)return;/* test mode / no balance code: falls back to the old pending+timeout behaviour below */
  balSale=s;balSaleTry=0;
  dialAdvBal(s);
}
function dialAdvBal(s){
  if(balSale!==s)return;/* resolved or superseded while waiting for the USSD channel to free up */
  if(balWait||cal)return setTimeout(()=>dialAdvBal(s),500);
  balWait=setTimeout(()=>{balWait=null;advBalResult(null)},20000);
  try{if(NativeBridge.dialUssdWake)NativeBridge.dialUssdWake(set.balCode,simSlot(),true);else NativeBridge.dialUssd(set.balCode,simSlot())}
  catch(e){clearTimeout(balWait);balWait=null;advBalResult(null)}
}
function advBalResult(v){
  const s=balSale;balSale=null;
  if(!s||s.status!=='pending')return;
  if(v==null){
    if(balSaleTry<2){balSaleTry++;addLog('Balance check for '+s.phone+' had no reply, retrying');balSale=s;return setTimeout(()=>dialAdvBal(s),5000)}
    addLog('Could not confirm airtime deduction for '+s.phone+' - leaving it to time out or a Safaricom confirmation text');
    return;
  }
  setBal(v);
  if(s.balBefore==null||v<s.balBefore){
    s.status='success';s.reason='';s.ts=Date.now();try{celebrate(s)}catch(e){}textClient(s,'ok');done();
  }else{
    fail(s,'Airtime balance unchanged - steps completed but nothing was deducted');done();
  }
}
function ussdOne(s,txt){
  const t=txt.replace(/\s+/g,' ').trim();
  addLog('USSD reply: '+t.slice(0,90));
  if(FAILRE.test(t)){const why=t.slice(0,160);fail(s,why);if(isDup(why))textClient(s,'dup');return done()}
  s.status='pending';s.ts=Date.now();done();
}
function dial(s){
  s.status='dialing';s.reason='';s.ts=Date.now();s.step=0;if(s.steps)s.balBefore=bal?bal.v:null;save();render();
  if(hasBridge()){try{if(NativeBridge.dialUssdWake)NativeBridge.dialUssdWake(s.ussd,simSlot(),true);else NativeBridge.dialUssd(s.ussd,simSlot())}catch(e){fail(s,'Could not dial: '+e);save();render()}}
  else addLog('TEST MODE - would dial '+(s.steps?s.steps.join(' > '):s.ussd));
}
function pump(){
  if(window.Team&&!Team.canDial())return;
  if(busy())return;
  const q=sales.slice().reverse().find(x=>x.status==='queued'&&(set.auto||x.manual));
  const w=nextAt-Date.now();
  if(w>0){clearTimeout(pt);pt=setTimeout(pump,w+20);return}
  /* customers first: the balance check waits until the queue is empty */
  if(needBal&&Date.now()>=balAt&&!q){if(set.autoBal&&hasBridge()){refreshBal(true);return}needBal=false}
  if(q)dial(q)}
function dialNow(id){
  const s=sales.find(x=>x.id===id);if(!s)return;
  if(s.status==='failed'&&!confirm('The earlier try may have gone through. Dial again for '+s.phone+'?'))return;
  if(!s.ussd){const o=offers.find(x=>x.amount===s.amount&&x.on);if(!o||!s.phone)return toast('Still no active offer or number for this sale');build(s,o)}
  if(busy()){s.status='queued';s.reason='';save();render();return toast('Queued - another dial is running')}
  dial(s);
}
setInterval(()=>{
  const now=Date.now();
  if(cal&&now-cal.ts>45000)calEnd('fail','No reply from Safaricom at step '+(cal.step+1));
  sales.forEach(s=>{
    if(s.status==='dialing'&&now-s.ts>45000)fail(s,s.steps?'No reply at step '+(s.step+1):'No reply after dialing');
    else if(s.status==='pending'&&now-s.ts>set.wait*60000)fail(s,'No confirmation from Safaricom');
  });
  save();pump();render();
},5000);
setInterval(pump,400);

/* ---------- calibrate: run every step of an advanced offer except the last option, and list what happened ---------- */
const normMenu=t=>String(t||'').toLowerCase().replace(/\s+/g,' ').trim();
function calStart(id,quiet){
  const o=offers.find(x=>x.id===id&&x.adv);if(!o){calQ=[];return}
  if(!hasBridge()||!NativeBridge.replyUssd){calQ=[];return toast('Calibrate only works in the Android app')}
  if(busy()){calQ=[];return toast('Another dial is running. Try again in a moment.')}
  let n=normPhone(set.calNum);
  if(!n){
    const x=prompt('Calibrate runs the offer on a number of yours but never sends the last option, so nothing is bought.\nType your OWN phone number (asked only once):','');
    if(x===null){calQ=[];return}
    n=normPhone(x);if(!n){calQ=[];return toast('Enter a valid number like 0712345678')}
    set.calNum=n;save();
  }
  cal={o,quiet:!!quiet,steps:o.steps.map(t=>t.replace(/\bn\b/gi,n)),step:0,ts:Date.now(),trail:[]};
  addLog('Calibrating '+o.name+' (stops before the last option)');
  toast('Calibrating '+o.name+'... do not touch the phone');
  try{NativeBridge.dialUssd(cal.steps[0],simSlot())}catch(e){calEnd('fail','Could not dial: '+e)}
  render();
}
function calReply(txt){
  const c=cal;if(!c)return;
  const clean=String(txt).replace(/\s+/g,' ').trim();
  c.ts=Date.now();
  const row={did:c.step===0?'Dialed '+c.steps[0]:'Sent '+c.steps[c.step],menu:String(txt).trim().slice(0,400)};
  c.trail.push(row);
  addLog('Calibrate step '+(c.step+1)+' reply: '+clean.slice(0,90));
  if(FAILRE.test(clean)){row.bad=1;return calEnd('fail','Safaricom said: '+clean.slice(0,160))}
  c.step++;
  if(c.step<c.steps.length-1){            /* more steps to go, and the next one is not the last */
    const i=c.step;
    setTimeout(()=>{
      if(cal!==c||c.step!==i)return;
      try{NativeBridge.replyUssd(c.steps[i])}catch(e){calEnd('fail','Could not send step '+(i+1))}
    },spd()[0]);
  }else calEnd('reached','')              /* the next one IS the last option: stop here, never send it */
}
function calEnd(kind,text){
  const c=cal;if(!c)return;
  cal=null;endSession();
  const o=c.o,last=c.steps[c.steps.length-1];
  let state,msg;
  if(kind==='reached'){
    c.trail.push({did:'Last step "'+last+'" NOT sent',menu:'Bn stops here so nothing is bought.',skip:1});
    state='ok';msg='All '+(c.steps.length-1)+' steps worked. Stopped before the last option so nothing was bought.';
  }else{
    if(!c.trail.length||!c.trail[c.trail.length-1].bad)c.trail.push({did:'Stopped',menu:text,bad:1});
    state='bad';msg=text;
  }
  o.cal={t:Date.now(),state,msg,trail:c.trail};
  let paused=false;
  if(state==='bad'&&set.calOff!==false&&o.on){o.on=false;paused=true;o.cal.paused=true}
  addLog('Calibrate '+o.name+': '+state.toUpperCase()+' - '+msg+(paused?' Offer paused.':''));
  save();nextAt=Date.now()+spd()[1];
  calSum.push(o.id);
  if(calQ.length){setTimeout(calNext,2500)}
  else{
    const ids=calSum.slice();calSum=[];
    if(ids.length>1)calSummary(ids);else calShow(o.id);
  }
  render();pump();
}
function calNext(){
  const id=calQ[0];if(!id)return;
  if(busy())return setTimeout(calNext,4000);
  calQ.shift();calStart(id,true);
}
function calAll(){
  const l=offers.filter(o=>o.adv&&o.on);
  if(!l.length)return toast('No active advanced offers to calibrate');
  if(!confirm('Calibrate '+l.length+' advanced offer'+(l.length>1?'s':'')+'? Each one is run step by step but the last option is never sent.'))return;
  calSum=[];calQ=l.map(o=>o.id);calNext();
}
const calSteps=o=>'<ol class="stp">'+((o.cal&&o.cal.trail)||[]).map((r,i)=>'<li class="'+(r.bad?'bad':r.skip?'skip':'')+'"><b>'+(r.bad?'\u274C':r.skip?'\u23F9':'\u2705')+' '+(i+1)+'. '+esc(r.did)+'</b>'+(r.menu?'<pre>'+esc(r.menu)+'</pre>':'')+'</li>').join('')+'</ol>';
const calIco=o=>o.cal&&o.cal.state==='ok'?'\u2705':'\u274C';
function calSummary(ids){
  const list=ids.map(id=>offers.find(x=>x.id===id)).filter(o=>o&&o.cal);
  $('#cT').textContent='Calibration done';
  $('#cB').innerHTML=list.map(o=>'<p style="margin:10px 0 0"><b>'+calIco(o)+' '+esc(o.name)+'</b><br><span class="hint">'+esc(o.cal.msg)+(o.cal.paused?' Offer paused.':'')+'</span></p><details class="cd"><summary>See the steps</summary>'+calSteps(o)+'</details>').join('')
    +(list.some(o=>o.cal.paused)?'<p class="hint">Failed offers were paused so no client gets the wrong bundle. Fix the code, then calibrate again.</p>':'');
  $('#cBtns').innerHTML='<button type="button" class="btn p" onclick="cdlg.close()">Close</button>';
  cdlg.showModal();
}
const cdlg=$('#cdlg');
function calShow(id){
  const o=offers.find(x=>x.id===id);if(!o||!o.cal||!o.cal.trail)return;
  $('#cT').textContent=calIco(o)+' '+o.name;
  $('#cB').innerHTML='<p class="hint" style="margin-top:0"><b>'+esc(o.cal.msg)+'</b></p>'+calSteps(o)+(o.cal.paused?'<p class="hint">\u23F8 This offer was paused so no client gets the wrong bundle.</p>':'');
  $('#cBtns').innerHTML=(o.cal.state==='bad'?'<button type="button" class="btn p" onclick="cdlg.close();calStart(\''+o.id+'\')">Calibrate again</button>':'')+'<button type="button" class="btn" onclick="cdlg.close()">Close</button>';
  if(!cdlg.open)cdlg.showModal();
}
function calLine(o){
  const c=o.cal;
  if(!c||!c.trail||(c.state!=='ok'&&c.state!=='bad'))return '<span>\uD83E\uDDEA Not calibrated yet</span>';
  const t=tm(c.t);
  return c.state==='ok'?'<span>\u2705 Calibrated '+t+'</span>':'<em>\u274C Calibration failed '+t+': '+esc(c.msg)+'</em>';
}

const PER={today:['Today',0],week:['7 days',6],month:['30 days',29],all:['All',null]};

/* *444*5*3*2*1*n*2#  ->  ["*444#","5","3","2","1","n","2"] */
function parseUssd(code){
  const c=String(code||'').replace(/\s+/g,'');
  if(!/^\*[0-9a-z*]+#$/i.test(c))return null;
  const p=c.slice(1,-1).split('*');
  if(p.length<2||p.some(x=>!x))return null;
  return ['*'+p[0]+'#'].concat(p.slice(1));
}
function advCode(steps){
  if(!steps||!steps.length)return '';
  return steps[0].replace(/#$/,'')+(steps.length>1?'*'+steps.slice(1).join('*'):'')+'#';
}
function advPreview(){
  const e=$('#aPrev'),c=$('#aCode').value.trim();
  if(!c){e.textContent='';return}
  const st=parseUssd(c);
  if(!st){e.textContent='Check the code: it must start with *, end with #, and have at least one reply after the first part.';return}
  e.innerHTML='Dial <b>'+esc(st[0])+'</b>'+st.slice(1).map((x,i)=>'<br>Step '+(i+1)+': select <b>'+esc(/^n$/i.test(x)?'phone number':x)+'</b>').join('')+'<br>Then done.';
}
function saveAdv(){
  const name=$('#aName').value.trim(),amount=+$('#aAmt').value,id=$('#aId').value;
  const steps=parseUssd($('#aCode').value);
  if(!name||!(amount>0)||!steps||!steps.some(x=>/^n$/i.test(x)))return toast('Add a name, a price, and a full code like *444*5*3*n*2# (with n for the phone number)');
  if(id){const o=offers.find(x=>x.id===id);const changed=advCode(o.steps)!==advCode(steps);Object.assign(o,{name,amount,steps});delete o.expect;if(changed)delete o.cal}else offers.push({id:uid(),name,amount,steps,adv:true,on:true});
  offers.sort((a,b)=>a.amount-b.amount);save();adlg.close();render();
}

  const nice=m=>{m=String(m||'');
    if(/EMAIL_EXISTS/.test(m))return 'That email already has an account.';
    if(/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL|MISSING_PASSWORD/.test(m))return 'Wrong email or password.';
    if(/WEAK_PASSWORD/.test(m))return 'Password must be at least 6 characters.';
    if(/TOO_MANY/.test(m))return 'Too many tries. Wait a few minutes.';
    if(/USER_DISABLED/.test(m))return 'This account has been disabled.';
    if(/Failed to fetch|NetworkError|abort/i.test(m))return 'No internet connection.';
    if(/permission/i.test(m))return 'Not allowed. Check the Firestore rules.';
    return m||'Something went wrong.'};
  async function api(url,o){
    o=o||{};const ac=new AbortController();const to=setTimeout(()=>ac.abort(),20000);
    try{
      const r=await fetch(url,{method:o.method||'GET',headers:Object.assign({'Content-Type':'application/json'},o.headers||{}),body:o.body,signal:ac.signal});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){const e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.status=r.status;throw e}
      return j;
    }finally{clearTimeout(to)}
  }
  const authCall=(op,b)=>api(AUTH+op+KEY,{method:'POST',body:JSON.stringify(b)});
  function setSes(j,email){
    T.ses={tok:j.idToken||j.id_token,ref:j.refreshToken||j.refresh_token,uid:j.localId||j.user_id,exp:Date.now()+(+(j.expiresIn||j.expires_in||3600))*1000-60000,email:email||j.email||(T.ses&&T.ses.email)||''};
    W('bn_ses',T.ses);
  }
  async function token(){
    if(!T.ses)throw new Error('Not signed in');
    if(Date.now()<T.ses.exp)return T.ses.tok;
    const j=await api('https://securetoken.googleapis.com/v1/token'+KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(T.ses.ref)});
    setSes(j);return T.ses.tok;
  }
  /* Firestore value helpers */
  const enc=v=>v===null||v===undefined?{nullValue:null}:typeof v==='number'?(Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v}):typeof v==='boolean'?{booleanValue:v}:{stringValue:String(v)};
  const encDoc=o=>({fields:Object.fromEntries(Object.entries(o).map(([k,v])=>[k,enc(v)]))});
  const dec=f=>f.stringValue!==undefined?f.stringValue:f.integerValue!==undefined?+f.integerValue:f.doubleValue!==undefined?f.doubleValue:f.booleanValue!==undefined?f.booleanValue:null;
  const decDoc=d=>d&&d.fields?Object.fromEntries(Object.entries(d.fields).map(([k,v])=>[k,dec(v)])):{};
  async function fsGet(path){
    const t=await token();
    try{return decDoc(await api(FSB()+'/'+path,{headers:{Authorization:'Bearer '+t}}))}
    catch(e){if(e.status===404)return null;throw e}
  }
  async function fsSet(path,obj,mask){
    const t=await token();
    const q=mask?'?'+mask.map(m=>'updateMask.fieldPaths='+encodeURIComponent(m)).join('&'):'';
    return api(FSB()+'/'+path+q,{method:'PATCH',headers:{Authorization:'Bearer '+t},body:JSON.stringify(encDoc(obj))});
  }
  async function fsQuery(coll,filters){
    const t=await token();
    const F=([k,v])=>({fieldFilter:{field:{fieldPath:k},op:'EQUAL',value:enc(v)}});
    const where=filters.length===1?F(filters[0]):{compositeFilter:{op:'AND',filters:filters.map(F)}};
    const r=await api(FSB()+':runQuery',{method:'POST',headers:{Authorization:'Bearer '+t},body:JSON.stringify({structuredQuery:{from:[{collectionId:coll}],where,limit:500}})});
    return r.filter(x=>x.document).map(x=>Object.assign(decDoc(x.document),{_id:x.document.name.split('/').pop()}));
  }
  const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const isOwner=()=>!!(T.on&&T.me&&T.me.role==='owner');

  /* ---------- who is using the app ---------- */
  function applyRole(){
    document.body.classList.toggle('att',!!(T.on&&T.me&&T.me.role==='attendant'));
    const tb=document.querySelector('nav button[data-t=team]');if(tb)tb.hidden=!isOwner();
    if(tab==='team'&&!isOwner())tab='home';
    const g=$('#gate');if(g)g.hidden=!T.on||!!(T.ses&&T.me);
  }
  function signOut(){
    T.ses=null;T.me=null;T.users=[];T.tsales=[];
    try{localStorage.removeItem('bn_ses');localStorage.removeItem('bn_me')}catch(e){}
    applyRole();render();
  }
  async function loadMe(strict){
    const d=await fsGet('users/'+T.ses.uid);
    if(!d){if(strict){signOut();throw new Error('No access yet. Ask the owner to add you.')}return}
    if(d.active===false){signOut();gerr('Your account is switched off. Contact the owner.');throw new Error('Your account is switched off. Contact the owner.')}
    T.me={role:d.role,name:d.name||'',ownerUid:d.ownerUid,email:d.email||T.ses.email,uid:T.ses.uid};
    W('bn_me',T.me);applyRole();
  }
  function gerr(m){const e=$('#gerr');if(e)e.textContent=m||''}
  function toggleMode(){
    T.gateNew=!T.gateNew;
    $('#gname').hidden=!T.gateNew;
    $('#gbtn').textContent=T.gateNew?'Create owner account':'Sign in';
    $('#gmode').textContent=T.gateNew?'Set up the owner account for your shop':'Sign in to continue';
    $('#gswitch').textContent=T.gateNew?'I already have an account':'New shop? Create the owner account';
    gerr('');
  }
  async function submit(){
    const email=$('#gemail').value.trim(),pw=$('#gpw').value,name=$('#gname').value.trim();
    if(!email||!pw)return gerr('Type your email and password.');
    if(T.gateNew&&!name)return gerr('Type your name.');
    const b=$('#gbtn');b.disabled=true;gerr('');
    try{
      if(T.gateNew){
        const j=await authCall('signUp',{email,password:pw,returnSecureToken:true});
        setSes(j,email);
        await fsSet('users/'+T.ses.uid,{email,name,role:'owner',ownerUid:T.ses.uid,active:true,createdAt:Date.now(),lastSeen:Date.now()});
      }else{
        const j=await authCall('signInWithPassword',{email,password:pw,returnSecureToken:true});
        setSes(j,email);
      }
      await loadMe(true);
      $('#gpw').value='';
      render();tick();
    }catch(e){if(!/switched off/.test(e.message))gerr(nice(e.message))}
    finally{b.disabled=false}
  }
  async function forgot(){
    const email=$('#gemail').value.trim();
    if(!email)return gerr('Type your email first, then tap Forgot password.');
    try{await authCall('sendOobCode',{requestType:'PASSWORD_RESET',email});gerr('A reset link was sent to '+email+'.')}catch(e){gerr(nice(e.message))}
  }

  /* ---------- background sync ---------- */
  async function pushOffers(){
    const j=JSON.stringify(offers);
    if(j===localStorage.getItem('bn_oh'))return;
    await fsSet('offers/'+T.ses.uid,{json:j,v:Date.now()});
    localStorage.setItem('bn_oh',j);
  }
  async function pullOffers(){
    const d=await fsGet('offers/'+T.me.ownerUid);
    if(d&&d.json&&String(d.v)!==localStorage.getItem('bn_ov')){
      offers=JSON.parse(d.json);W('bs_offers',offers);localStorage.setItem('bn_ov',String(d.v));render();
    }
  }
  const sig=s=>s.status+'|'+s.ts;
  const recent=s=>s.t>Date.now()-7*864e5;
  async function pushSales(){
    let n=0;
    try{
      for(const s of sales){
        if(!recent(s)||T.pushed[s.id]===sig(s))continue;
        if(++n>25)break;
        await fsSet('sales/'+T.ses.uid.slice(0,8)+'_'+String(s.id).replace(/[^A-Za-z0-9_-]/g,''),{
          ownerUid:T.me.ownerUid,uid:T.ses.uid,by:T.me.name||T.me.email||'',day:dayKey(s.t),t:s.t,ts:s.ts,
          amount:s.amount,phone:s.phone||'',client:s.client||'',offer:s.name||'',status:s.status,reason:s.reason||'',code:s.code||''});
        T.pushed[s.id]=sig(s);
      }
    }finally{W('bn_pushed',T.pushed)}
  }
  async function tick(){
    if(!T.on||!T.ses||!T.me||T.busy)return;
    T.busy=true;
    try{
      await loadMe(false);
      if(!T.ses)return;
      const now=Date.now();
      if(now-(T.seen||0)>300000){T.seen=now;fsSet('users/'+T.ses.uid,{lastSeen:now},['lastSeen']).catch(()=>{})}
      if(isOwner())await pushOffers();else await pullOffers();
      await pushSales();
    }catch(e){T.err=e.message}
    finally{T.busy=false}
  }
  function dirty(){
    if(!T.on||!T.ses||!T.me||T._t)return;
    let need=sales.some(s=>recent(s)&&T.pushed[s.id]!==sig(s));
    if(!need&&isOwner())need=JSON.stringify(offers)!==localStorage.getItem('bn_oh');
    if(need)T._t=setTimeout(()=>{T._t=0;tick()},3000);
  }

  /* ---------- owner: team screen ---------- */
  async function load(force){
    if(!isOwner()||T.loading)return;
    if(!force&&Date.now()-T.loadedAt<30000)return;
    T.loading=true;
    try{
      T.users=await fsQuery('users',[['ownerUid',T.ses.uid]]);
      const days=T.range==='today'?[0]:T.range==='yest'?[1]:[0,1,2,3,4,5,6];
      let all=[];
      for(const i of days){all=all.concat(await fsQuery('sales',[['ownerUid',T.ses.uid],['day',dayKey(startOf(i))]]))}
      T.tsales=all.sort((a,b)=>b.t-a.t);
      T.loadedAt=Date.now();T.err='';
    }catch(e){T.err=nice(e.message)}
    finally{T.loading=false;if(tab==='team')render()}
  }
  function setRange(r){T.range=r;T.loadedAt=0;T.tsales=[];fresh=true;render();load(true)}
  const ago=t=>{if(!t)return 'never';const m=Math.round((Date.now()-t)/60000);return m<2?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
  function view(){
    const v=$('#view');
    if(!isOwner()){v.innerHTML='';return}
    load();
    const per=(k,l)=>`<button class="${T.range===k?'on':''}" onclick="Team.setRange('${k}')">${l}</button>`;
    const people=[{uid:T.ses.uid,name:(T.me.name||'Owner')+' (you)',active:true,owner:true}].concat(T.users.filter(u=>u._id!==T.ses.uid).map(u=>({uid:u._id,name:u.name||u.email,email:u.email,active:u.active!==false,lastSeen:u.lastSeen})));
    const stat=p=>{const l=T.tsales.filter(s=>s.uid===p.uid),ok=l.filter(s=>s.status==='success');return{n:ok.length,sum:ok.reduce((a,s)=>a+s.amount,0),f:l.filter(s=>s.status==='failed').length}};
    const members=people.map(p=>{const s=stat(p);return `<li class="row o"><div class="amt">${fmt(s.sum)}<small>KSh</small></div><div class="mid"><b>${esc(p.name)}</b><span>${s.n} sold \u00B7 ${s.f} failed</span></div></li>`}).join('');
    const team=people.filter(p=>!p.owner).map(p=>`<li class="row ${p.active?'success':'failed'}"><div class="mid"><b>${esc(p.name)}</b><span>${esc(p.email||'')}</span><span>Last seen: ${ago(p.lastSeen)}</span><div class="btns"><button class="btn ${p.active?'d':''}" onclick="Team.setActive('${p.uid}',${!p.active})">${p.active?'\u23F8 Switch off':'\u25B6 Switch on'}</button><button class="btn" onclick="Team.reset('${esc(p.email||'')}')">\uD83D\uDD11 Reset password</button></div></div><div class="end"><span class="chip ${p.active?'g':'r'}">${p.active?'Active':'Off'}</span></div></li>`).join('');
    const recentRows=T.tsales.slice(0,40).map(s=>`<li class="row ${esc(s.status)}"><div class="amt">${s.amount}<small>KSh</small></div><div class="mid"><b>${esc(s.by||'')}</b><span>\uD83D\uDCF1 ${esc(s.phone||'')}</span><span>\uD83D\uDD52 ${tm(s.t)} \u00B7 ${esc([s.client,s.offer].filter(Boolean).join(' \u00B7 '))}</span>${s.reason?`<em>${esc(s.reason)}</em>`:''}</div><div class="end"><span class="chip ${s.status==='success'?'g':s.status==='failed'?'r':s.status==='queued'?'b':'a'}">${esc(s.status)}</span></div></li>`).join('');
    v.innerHTML=`<div class="hd"><h2 style="margin:12px 2px 6px">Team</h2><button class="btn" onclick="Team.load(true)">${T.loading?'Loading...':'\u21BB Refresh'}</button></div>
    <div class="per">${per('today','Today')}${per('yest','Yesterday')}${per('week','7 days')}</div>
    ${T.err?`<p class="note">${esc(T.err)}</p>`:''}
    <ul>${members}</ul>
    <div class="hd"><h2>People</h2><button class="btn p" onclick="Team.openAdd()">+ Add attendant</button></div>
    ${team?`<ul>${team}</ul>`:'<p class="empty"><big></big>No attendants yet. Add one so they can sell from their own phone.</p>'}
    <h2>Team sales</h2>${recentRows?`<ul>${recentRows}</ul>`:'<p class="hint">No sales in this period.</p>'}`;
  }
  function openAdd(){['tn','te','tp'].forEach(i=>$('#'+i).value='');$('#tmsg').textContent='';$('#tdlg').showModal()}
  async function addAttendant(){
    const name=$('#tn').value.trim(),email=$('#te').value.trim(),pw=$('#tp').value;
    if(!name||!email||pw.length<6)return $('#tmsg').textContent='Type a name, an email and a password of at least 6 characters.';
    const b=$('#tgo');b.disabled=true;$('#tmsg').textContent='Creating...';
    try{
      const j=await authCall('signUp',{email,password:pw,returnSecureToken:true});   /* the new account's own tokens are not used here */
      await fsSet('users/'+j.localId,{email,name,role:'attendant',ownerUid:T.ses.uid,active:true,createdAt:Date.now(),lastSeen:0});
      $('#tdlg').close();toast('Added '+name+'. Give them the email and password.');load(true);
    }catch(e){$('#tmsg').textContent=nice(e.message)}
    finally{b.disabled=false}
  }
  async function setActive(uid,on){
    if(!on&&!confirm('Switch this person off? They will not be able to sell or see sales.'))return;
    try{await fsSet('users/'+uid,{active:on},['active']);toast(on?'Switched on':'Switched off');load(true)}catch(e){toast(nice(e.message))}
  }
  async function reset(email){
    if(!email)return;
    try{await authCall('sendOobCode',{requestType:'PASSWORD_RESET',email});toast('Reset link sent to '+email)}catch(e){toast(nice(e.message))}
  }
  const account=()=>!T.on?'':`<h2 style="margin-top:12px">Account</h2><p class="hint">${T.me?'Signed in as <b>'+esc(T.me.name||T.me.email)+'</b> ('+(T.me.role==='owner'?'owner':'attendant')+') \u00B7 '+esc(T.me.email||''):'Not signed in'}</p><div class="btns"><button class="btn d" onclick="Team.out()">Sign out</button></div>`;
  function out(){if(confirm('Sign out? Bn will stop selling until you sign in again.'))signOut()}
  const canDial=()=>!T.on||!!(T.ses&&T.me);
  function init(){
    applyRole();
    if(T.on&&T.ses&&T.me){tick()}
    if(T.on){setInterval(tick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})}
  }
  return {T,init,submit,toggleMode,forgot,view,load,setRange,openAdd,addAttendant,setActive,reset,account,out,canDial,dirty,isOwner,_:{enc,decDoc,dayKey,fsSet,fsGet,fsQuery,tick,pushSales}};
})();
window.Team=Team;
Team.init();

$('#nav').onclick=e=>{const t=e.target.closest('button');if(!t)return;tab=t.dataset.t;fresh=true;render();if(tab==='settings')settingsView();window.scrollTo(0,0)};
$('#auto').onchange=e=>{set.auto=e.target.checked;save();pump();render()};
render();pump();
</script>
</body>
</html>
