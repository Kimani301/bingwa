name: Build Bn APK and publish install page

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Assemble install site (page + APK)
        run: |
          mkdir site
          cp -r docs/. site/
          cp app/build/outputs/apk/debug/app-debug.apk site/Bn.apk
          VER=$(grep -m1 versionName app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          DATE=$(date -u +"%-d %b %Y")
          echo "{\"version\":\"$VER\",\"date\":\"$DATE\",\"commit\":\"${GITHUB_SHA::7}\"}" > site/version.json
      - name: Publish APK as a GitHub Release (download link that always works)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest site/Bn.apk --title "Bn latest" --notes "Install page and APK. Open the site link on your Android phone." --latest
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: Bn-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
